name: Health Monitor

on:
  schedule:
    # Every 12 minutes. Render free instances sleep after ~15 min idle, and
    # GitHub's scheduler routinely runs several minutes late, so keep a margin.
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A late-scheduled run should never overlap the next one.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  # Keeps the Render free instance from sleeping. Best-effort by design: a
  # sleeping client is not an incident, so this only warns.
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render client
        env:
          URL: https://kanban-collab-client.onrender.com
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 "$URL" || echo 000)
          echo "client: HTTP $code"
          case "$code" in
            2*|3*) ;;
            *) echo "::warning::Render client answered $code" ;;
          esac

  # The API, held to a standard rather than nudged awake.
  #
  # This used to live in the keep-alive job as a `::warning::`, which is
  # invisible: a scheduled run that warns looks exactly like one that passes
  # unless somebody opens the log. It now fails the run, and optionally posts
  # the same JSON the server's error reporter sends, so "the API is down" and
  # "the API threw" arrive in the same place.
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liveness — /healthz
        env:
          BASE: https://kanban-collab-server.vercel.app
        run: |
          set -euo pipefail

          body=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 "$BASE/healthz" || true)
          echo "healthz: $body"

          if ! grep -q '"status":"UP"' <<<"$body"; then
            echo "::error::/healthz is not UP"
            exit 1
          fi

      - name: Readiness — /readyz
        # always() so a failed liveness check still shows whether the
        # dependencies are the reason.
        if: always()
        env:
          BASE: https://kanban-collab-server.vercel.app
        run: |
          set -euo pipefail

          # 503 is the documented "a dependency is down" answer, so the status
          # code is the assertion and the body is the explanation.
          code=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' \
            --max-time 20 --retry 2 --retry-delay 5 "$BASE/readyz" || echo 000)
          echo "readyz: HTTP $code"
          cat /tmp/readyz.json || true

          if [ "$code" != "200" ]; then
            echo "::error::/readyz answered $code — a dependency is down"
            exit 1
          fi

          if ! grep -q '"status":"UP"' /tmp/readyz.json; then
            echo "::error::/readyz returned 200 without reporting UP"
            exit 1
          fi

      - name: Alert the webhook, when one is configured
        # Step-level `env` is not visible to `if`, so the emptiness check lives
        # in the script: without it this step would be skipped on every failure.
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK}" ]; then
            echo "No ALERT_WEBHOOK_URL secret — the failed run is the alert."
            exit 0
          fi

          curl -sS --max-time 10 -X POST "$WEBHOOK" \
            -H 'content-type: application/json' \
            -d "$(cat <<JSON
          {
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "health-monitor",
            "name": "HealthCheckFailed",
            "message": "kanban-collab-server failed its health check",
            "url": "https://kanban-collab-server.vercel.app/healthz",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          )" || echo "::warning::alert webhook did not accept the report"

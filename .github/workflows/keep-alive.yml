name: Keep Render Client Alive

on:
  schedule:
    - cron: '*/12 * * * *'   
  workflow_dispatch:         

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Client
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://kanban-collab-client.onrender.com
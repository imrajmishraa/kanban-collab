name: Deploy

# Deploys only the side of the stack whose files actually changed.
#
#   client/**  (or render.yaml)  ->  Render  static web  (kanban-collab-client)
#   server/**                    ->  Vercel  API         (kanban-collab-server)
#
# A commit that touches neither path (docs, README, docker-compose.yml, …)
# deploys nothing. Each deploy is gated on that side's own build succeeding
# first, so a broken build never reaches production.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which side to deploy
        type: choice
        options: [both, client, server]
        default: both

# Never cancel a deploy that is already in flight; queue the next one instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Live origins of the two deployments — update here if a domain changes.
env:
  CLIENT_URL: https://kanban-collab-client.onrender.com
  SERVER_URL: https://kanban-collab-server.vercel.app

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Work out where the change landed
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: Decide what to deploy
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.targets.outputs.client }}
      server: ${{ steps.targets.outputs.server }}
    steps:
      # fetch-depth: 0 so paths-filter can diff the pushed range against its
      # parent commit; a shallow clone hides the "before" commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
              - 'render.yaml'
            server:
              - 'server/**'

      - name: Resolve deploy targets
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          CLIENT_CHANGED: ${{ steps.filter.outputs.client }}
          SERVER_CHANGED: ${{ steps.filter.outputs.server }}
        run: |
          set -euo pipefail

          client=false
          server=false

          if [ "$EVENT" = "push" ]; then
            client="${CLIENT_CHANGED:-false}"
            server="${SERVER_CHANGED:-false}"
          else
            case "${INPUT_TARGET:-both}" in
              client) client=true ;;
              server) server=true ;;
              *)      client=true; server=true ;;
            esac
          fi

          {
            echo "client=$client"
            echo "server=$server"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deploy plan"
            echo ""
            echo "| Target | Changed | Will deploy |"
            echo "|---|---|---|"
            echo "| client → Render | $client | $([ "$client" = true ] && echo yes || echo no) |"
            echo "| server → Vercel | $server | $([ "$server" = true ] && echo yes || echo no) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "client=$client server=$server"

  # ───────────────────────────────────────────────────────────────────────────
  # 2a. Client → Render (static web)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy client → Render
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Typecheck & build
        working-directory: client
        run: npm run build

      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_WEB is not set (Repo → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -X POST --retry 3 --retry-delay 5 --max-time 30 "$HOOK"

      - name: Wait for Render to serve the new build
        continue-on-error: true
        env:
          URL: https://kanban-collab-client.onrender.com
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
            case "$code" in
              2*|3*) echo "Client is up (HTTP $code)"; exit 0 ;;
            esac
            echo "attempt $i: HTTP ${code:-000}, retrying…"
            sleep 10
          done
          echo "::warning::Client did not respond within ~5 minutes — check the Render dashboard."

  # ───────────────────────────────────────────────────────────────────────────
  # 2b. Server → Vercel (API)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-server:
    name: Deploy server → Vercel
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Typecheck & build
        working-directory: server
        run: npm run build

      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_SERVER is not set (Repo → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -X POST --retry 3 --retry-delay 5 --max-time 30 "$HOOK"

      - name: Wait for Vercel to serve the new build
        continue-on-error: true
        env:
          URL: https://kanban-collab-server.vercel.app
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL/healthz" || true)
            case "$code" in
              2*|3*) echo "API is up (HTTP $code)"; exit 0 ;;
            esac
            echo "attempt $i: HTTP ${code:-000}, retrying…"
            sleep 10
          done
          echo "::warning::API did not answer /healthz within ~5 minutes — check the Vercel dashboard."

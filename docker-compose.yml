# ─────────────────────────────────────────────────────────────────────────────
# kanban-collab — full production-like stack
#
#   web   → nginx serving the built SPA, proxying /api + /ws to api (:3000)
#   api   → the Node/Yjs backend (REST + WebSocket) on :3000
#   mongo → MongoDB
#   cache → Redis (cache + Yjs pub/sub)
#
# Usage (from the repo root):
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down            # add -v to also drop the volumes
#
# PORT is 3000 everywhere — same as local dev, the health scripts, the vite
# proxy, and the nginx upstream — so nothing can drift out of sync.
# ─────────────────────────────────────────────────────────────────────────────

name: kanban-collab

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: kanban-collab-client:latest
    container_name: kanban-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kanban-net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: kanban-collab-server:latest
    container_name: kanban-api
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/kanban-collab
      REDIS_URL: redis://cache:6379
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      cache:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks:
      - kanban-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  mongo:
    image: mongo:7
    container_name: kanban-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - kanban-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    image: redis:7-alpine
    container_name: kanban-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - kanban-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
  uploads:

networks:
  kanban-net:
    driver: bridge
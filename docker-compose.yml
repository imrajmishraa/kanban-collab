# ─────────────────────────────────────────────────────────────────────────────
# kanban-collab — full production-like stack
#
#   web   → nginx serving the built SPA, proxying /api + /ws to api
#   api   → the Node/Yjs backend (REST + WebSocket)
#   mongo → MongoDB
#   redis → Redis (cache + Yjs pub/sub)
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# The api service reads ./server/.env for secrets (JWT, OAuth, …). The
# connection vars below override it so the app talks to the compose services.
# ─────────────────────────────────────────────────────────────────────────────

name: kanban-collab

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: kanban-collab-client:latest
    container_name: kanban-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [kanban-net]

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: kanban-collab-server:latest
    container_name: kanban-api
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/kanban-collab
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks: [kanban-net]

  mongo:
    image: mongo:7
    container_name: kanban-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [kanban-net]

  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [kanban-net]

volumes:
  mongo_data:
  redis_data:
  uploads:

networks:
  kanban-net:
    driver: bridge

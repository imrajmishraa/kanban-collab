<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- No-flash theme: sets the correct class on <html> BEFORE first paint.
         Reads the same "kanban-theme" key (same envelope shape) that the
         Zustand store in stores/theme.ts writes. Keep this FIRST in <head>. -->
    <script>
      (function () {
        /* The store persists `mode`, not `theme`, so read that first and fall
           back to the older `theme` entry for anyone mid-migration. */
        var prefersLight = false;
        try {
          prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        } catch (e) {
          prefersLight = false;
        }

        var mode = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("kanban-theme") || "{}");
          var state = saved && saved.state ? saved.state : {};
          mode = state.mode || state.theme || "system";
        } catch (e) {
          mode = "system";
        }

        var theme = mode === "system" ? (prefersLight ? "light" : "dark") : mode;
        if (theme !== "light" && theme !== "dark") theme = "dark";
        var root = document.documentElement;
        root.classList.toggle("light", theme === "light");
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
      })();
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Kanban Collab</title>
    <meta
      name="description"
      content="Enterprise Kanban Collaboration Platform — Real-time collaborative project management"
    />
    <meta name="theme-color" content="#0A0F0D" />
    <meta property="og:title" content="Kanban Collab — Real-time collaborative project management" />
    <meta
      property="og:description"
      content="Enterprise Kanban Collaboration Platform — Real-time collaborative project management"
    />
    <meta property="og:type" content="website" />

    <!-- Tab icon: single file, single reference, no preload needed —
         the Navbar logo is now an inline SVG component in the bundle. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Primary UI font + technical monospace font -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>

# ─────────────────────────────────────────────────────────────────────────────
# kanban-collab client — nginx server block
#
#   - Serves the Vite bundle from /usr/share/nginx/html with SPA fallback.
#   - Serves the precompressed .gz siblings (gzip_static) the build produced.
#   - Reverse-proxies /api and /ws to the backend.
#   - Immutable caching for hashed assets, no-cache for index.html.
#
# The backend host is resolved AT REQUEST TIME (resolver + variable) rather than
# at startup. That means nginx boots even when the api container isn't up yet,
# and it picks up a new IP after the api container restarts. `127.0.0.11` is
# Docker's embedded DNS, available on user-defined networks (e.g. compose).
#
# NOTE: change `api:3000` to match your backend's PORT (e.g. api:5000).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Resolve upstreams at request time, not at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Compression ──────────────────────────────────────────────────────────
    # Serve the .gz files vite-plugin-compression2 already generated instead of
    # compressing on the fly. (Brotli needs the ngx_brotli module.)
    gzip_static on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"   always;

    # ── Hashed assets: cache forever ─────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html: never cache (so a new deploy takes effect immediately) ───
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── API proxy ────────────────────────────────────────────────────────────
    location /api/ {
        set $backend http://api:3000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket (Yjs) proxy ────────────────────────────────────────────────
    location /ws {
        set $backend http://api:3000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# kanban-collab client — nginx server block
#
#   - Serves the Vite bundle from /usr/share/nginx/html with SPA fallback.
#   - Serves the precompressed .gz siblings (gzip_static) the build produced.
#   - Reverse-proxies /api and /ws to the backend, so the SPA talks to its own
#     origin (axios baseURL is "/api/v1") — no CORS, no build-time API URL.
#   - Immutable caching for hashed assets, no-cache for index.html.
# ─────────────────────────────────────────────────────────────────────────────

# Backend origin. `api` is the compose service name.
# NOTE: nginx resolves this once at startup. If the api container restarts with
# a new IP, reload nginx (docker compose restart web) — or switch to a
# `resolver 127.0.0.11 valid=10s;` + `set $backend ...; proxy_pass $backend;`
# form for dynamic re-resolution.
upstream backend {
    server api:3000;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    # Serve the .gz files vite-plugin-compression2 already generated instead of
    # compressing on the fly. (Brotli needs the ngx_brotli module.)
    gzip_static on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"   always;

    # ── Hashed assets: cache forever ─────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html: never cache (so a new deploy takes effect immediately) ───
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── API proxy ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket (Yjs) proxy ────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

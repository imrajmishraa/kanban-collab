services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: kanban-collab-server:latest
    container_name: kanban-api
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/kanban-collab
      REDIS_URL: redis://cache:6379
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      cache:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks:
      - kanban-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  mongo:
    image: mongo:7
    container_name: kanban-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - kanban-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    image: redis:7-alpine
    container_name: kanban-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - kanban-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
  uploads:
  logs:

networks:
  kanban-net:
    driver: bridge

services:
  - type: web
    name: kanban-collab-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Deploy only when the CI/CD workflow fires the deploy hook for this
    # service (see .github/workflows/ci-cd.yml), not on every push to main.
    # `off` is the current spelling; `autoDeploy: false` is the deprecated alias.
    autoDeployTrigger: 'off'
    pullRequestPreviewsEnabled: true
    envVars:
      # Pin the build to Node 22 to match client/package.json "engines".
      - key: NODE_VERSION
        value: "22"
      # F-3: Vite inlines VITE_* at build time. The static client and the API are
      # separate origins on Render, so point the socket at the API host.
      - key: VITE_WS_URL
        value: wss://kanban-collab-server.vercel.app/ws

    routes:
      # /api → the API. A rewrite is server-side and keeps the browser on this
      # origin, so CORS and first-party cookies behave exactly as they did behind
      # nginx. This rule MUST come before the SPA catch-all, or the catch-all
      # swallows it.
      - type: rewrite
        source: /api/*
        destination: https://kanban-collab-server.vercel.app/api/:splat

      # SPA fallback — everything else serves index.html and react-router takes over.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # ── Security headers (mirrors nginx.conf.template) ──────────────────────
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=()"

      # ── Caching (mirrors nginx.conf.template) ────────────────────────────────
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache

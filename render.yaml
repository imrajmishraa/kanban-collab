
services:
  - type: web
    name: kanban-collab-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Pin the build to Node 22 to match client/package.json "engines".
      - key: NODE_VERSION
        value: "22"

    routes:
      # /api → the API. A rewrite is server-side and keeps the browser on this
      # origin, so CORS and first-party cookies behave exactly as they did behind
      # nginx. This rule MUST come before the SPA catch-all, or the catch-all
      # swallows it.
      - type: rewrite
        source: /api/*
        destination: https://kanban-collab-server.onrender.com/api/:splat

      # SPA fallback — everything else serves index.html and react-router takes over.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # ── Security headers (mirrors nginx.conf.template) ──────────────────────
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=()"

      # ── Caching (mirrors nginx.conf.template) ────────────────────────────────
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
